<title>Worklog</title>
<style>
/* 色板 = 一组变量，亮色、暗色各一段。新增色板：照下面 Solarized 的写法加两段 :root[data-palette=…][data-theme=light|dark]，再到 app.js 的 PALETTES 里登记名字 */
:root,:root[data-theme=light]{--bg:#fff;--panel:#fff;--ink:#1C2024;--ink2:#3A434C;--muted:#5B6570;--faint:#8A939D;--line:#E3E6EA;--line2:#C9CED4;--soft:#F6F7F9;--accent:#2459D6;--on:#fff;--edit:#F3F6FE;--kind0:#6B3FA0;
--todo-bg0:#E4ECFD;--todo0:#1B47B5;--wait-bg0:#FCEBD3;--wait0:#8A4B00;--done-bg:#E6EAEE;--done:#4A545E;--warn-bg:#FFF1C7;--warn:#6B4E00;--err-bg:#FDE3E1;--err:#9B1C13;--ok-bg0:#DDF3E4;--ok0:#17603A;--shadow:rgba(28,32,36,.14);
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:light}
:root[data-theme=dark]{--bg:#15181C;--panel:#1C2025;--ink:#E6E9EC;--ink2:#C3C9CF;--muted:#98A2AC;--faint:#6F7882;--line:#2B3138;--line2:#3B434C;--soft:#1C2025;--accent:#7AA2FF;--on:#15181C;--edit:#1D2638;--kind0:#C3A0F0;
--todo-bg0:#1E2C4D;--todo0:#A9C2FF;--wait-bg0:#41301A;--wait0:#F2C078;--done-bg:#2A3038;--done:#A6AFB8;--warn-bg:#40361A;--warn:#F0D684;--err-bg:#472220;--err:#FFB1AA;--ok-bg0:#1B3A29;--ok0:#8ED8A9;--shadow:rgba(0,0,0,.5);color-scheme:dark}
/* 配色 Solarized（Ethan Schoonover，https://ethanschoonover.com/solarized/）。配色和亮暗是两回事：
   data-palette 选色板，data-theme 选亮或暗，两者组合；选择器带上 palette，优先级高于上面的默认色板 */
:root[data-palette=solarized] {
  --base03: #002b36;
  --base02: #073642;
  --base01: #586e75;
  --base00: #657b83;
  --base0: #839496;
  --base1: #93a1a1;
  --base2: #eee8d5;
  --base3: #fdf6e3;
  --blue: #268bd2;
  --violet: #6c71c4;
  --yellow: #b58900;
  --orange: #cb4b16;
  --red: #dc322f;
  --green: #859900;
}
:root[data-palette=solarized][data-theme=light] {
  --bg: var(--base3);
  --panel: color-mix(in srgb, var(--base3) 84%, white);
  --soft: var(--base2);
  --ink: var(--base02);
  --ink2: var(--base01);
  --muted: var(--base01);
  --faint: color-mix(in srgb, var(--base00) 83%, var(--base02));
  --on: var(--base3);
  --line: color-mix(in srgb, var(--base2) 83%, var(--base01));
  --line2: color-mix(in srgb, var(--base2) 62%, var(--base01));
  --accent: color-mix(in srgb, var(--blue) 71%, var(--base03));
  --edit: color-mix(in srgb, var(--base3) 89%, var(--blue));
  --kind0: color-mix(in srgb, var(--violet) 77%, var(--base03));
  --todo-bg0: color-mix(in srgb, var(--base3) 86%, var(--blue));
  --todo0: color-mix(in srgb, var(--blue) 52%, var(--base03));
  --wait-bg0: color-mix(in srgb, var(--base3) 80%, var(--yellow));
  --wait0: color-mix(in srgb, var(--yellow) 55%, var(--base03));
  --done-bg: color-mix(in srgb, var(--base3) 82%, var(--base1));
  --done: var(--base01);
  --warn-bg: color-mix(in srgb, var(--base3) 76%, var(--yellow));
  --warn: color-mix(in srgb, var(--yellow) 49%, var(--base03));
  --err-bg: color-mix(in srgb, var(--base3) 86%, var(--red));
  --err: color-mix(in srgb, var(--red) 62%, var(--base03));
  --ok-bg0: color-mix(in srgb, var(--base3) 82%, var(--green));
  --ok0: color-mix(in srgb, var(--green) 52%, var(--base03));
  --shadow: rgba(0,43,54,.14);
  color-scheme: light;
}
:root[data-palette=solarized][data-theme=dark] {
  --bg: var(--base03);
  --panel: color-mix(in srgb, var(--base03) 40%, var(--base02));
  --soft: var(--base02);
  --ink: #cbd1c2;
  --ink2: var(--base1);
  --muted: var(--base1);
  --faint: color-mix(in srgb, var(--base0) 87%, var(--base2));
  --on: var(--base03);
  --line: color-mix(in srgb, var(--base02) 73%, var(--base0));
  --line2: color-mix(in srgb, var(--base02) 58%, var(--base0));
  --accent: color-mix(in srgb, var(--blue) 68%, var(--base3));
  --edit: color-mix(in srgb, var(--base03) 82%, var(--blue));
  --kind0: color-mix(in srgb, var(--violet) 63%, var(--base3));
  --todo-bg0: color-mix(in srgb, var(--base02) 83%, var(--blue));
  --todo0: color-mix(in srgb, var(--blue) 56%, var(--base3));
  --wait-bg0: color-mix(in srgb, var(--base03) 77%, var(--yellow));
  --wait0: color-mix(in srgb, var(--yellow) 61%, var(--base3));
  --done-bg: color-mix(in srgb, var(--base03) 71%, var(--base0));
  --done: color-mix(in srgb, var(--base1) 80%, var(--base2));
  --warn-bg: color-mix(in srgb, var(--base03) 75%, var(--yellow));
  --warn: color-mix(in srgb, var(--yellow) 52%, var(--base3));
  --err-bg: color-mix(in srgb, var(--base03) 75%, var(--red));
  --err: color-mix(in srgb, var(--red) 47%, var(--base3));
  --ok-bg0: color-mix(in srgb, var(--base03) 78%, var(--green));
  --ok0: color-mix(in srgb, var(--green) 58%, var(--base3));
  --shadow: rgba(0,15,19,.55);
  color-scheme: dark;
}
/* 颜色风格：只管着色的文字和标签（人名、类型、状态、项目引用、胶囊），不动背景和界面本身 */
:root{--person:var(--accent);--kind:var(--kind0);--todo:var(--todo0);--todo-bg:var(--todo-bg0);--wait:var(--wait0);--wait-bg:var(--wait-bg0);--ok:var(--ok0);--ok-bg:var(--ok-bg0);--done-fg:var(--done);--done-chip:var(--done-bg);--tagw:400}
:root[data-color=soft]{--person:color-mix(in srgb,var(--accent) 45%,var(--muted));--kind:color-mix(in srgb,var(--kind0) 45%,var(--muted));--todo:color-mix(in srgb,var(--todo0) 50%,var(--muted));--todo-bg:color-mix(in srgb,var(--todo-bg0) 45%,var(--soft));--wait:color-mix(in srgb,var(--wait0) 50%,var(--muted));--wait-bg:color-mix(in srgb,var(--wait-bg0) 45%,var(--soft));--ok:color-mix(in srgb,var(--ok0) 50%,var(--muted));--ok-bg:color-mix(in srgb,var(--ok-bg0) 45%,var(--soft))}
:root[data-color=mono]{--person:var(--ink);--kind:var(--muted);--todo:var(--on);--todo-bg:var(--ink2);--wait:var(--ink);--wait-bg:var(--line2);--ok:var(--muted);--ok-bg:var(--line);--done-fg:var(--faint);--done-chip:var(--soft);--tagw:600}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
#gate{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#gate h1{margin:0;font-size:22px;font-weight:600}
#gate p{margin:0;color:var(--muted);max-width:460px}
#app{height:100%;display:flex}
#col{flex:1;min-width:0;display:flex;flex-direction:column}
#journal{flex:1;min-height:0;display:flex;flex-direction:column}
/* 侧栏 */
#nav{flex:0 0 200px;display:flex;flex-direction:column;gap:8px;padding:10px;border-right:1px solid var(--line);background:var(--soft)}
#nav-head{display:flex;align-items:center;justify-content:space-between;height:32px;padding-left:8px}
#brand{font-weight:600}
#nav-toggle{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:6px}
#nav-toggle:hover{background:var(--line)}
#q{height:32px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 10px;font-size:13px}
#nav-items{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:8px;background:transparent;font-size:14px;text-align:left;color:var(--ink2)}
.nav-item:hover{background:var(--line)}
.nav-item.on{background:var(--ink);color:var(--on)}
.nav-label{flex:1}
.ico{width:22px;height:22px;flex:none}
.count{min-width:18px;padding:0 5px;border-radius:9px;background:var(--line);color:var(--muted);font-size:11px;font-weight:600;text-align:center;line-height:18px}
.count.warn{background:var(--warn-bg);color:var(--warn)}
#nav.narrow{flex-basis:56px;padding:10px 8px}
#nav.narrow #brand,#nav.narrow #q,#nav.narrow .nav-label,#nav.narrow .count{display:none}
#nav.narrow #nav-head{padding:0;justify-content:center}
#nav.narrow .nav-item{justify-content:center;padding:0}
/* 日志页 */
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line)}
header h1{margin:0 6px;font-size:17px;font-weight:600}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px}
.btn:hover{background:var(--soft)}
.btn.primary{height:40px;padding:0 18px;background:var(--ink);color:var(--on);border-color:var(--ink);font-size:14px}
.btn.sq{width:32px;padding:0;font-size:16px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--on);border-color:var(--ink)}
.chip{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--soft);border-radius:6px;padding:2px 8px}
.grow{flex:1}
#banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px;background:var(--warn-bg);color:var(--warn);font-size:14px}
main{flex:1;display:flex;min-height:0}
#editor-wrap{flex:1 1 0;min-width:0;overflow:auto;padding:16px 20px 80px}
#side{flex:0 0 44%;max-width:640px;border-left:1px solid var(--line);background:var(--soft);overflow:auto;padding:14px 16px}
footer{display:flex;gap:12px;padding:3px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);font-family:var(--mono)}
#saved{opacity:.75}
.kids{margin-left:11px;padding-left:19px;border-left:1px solid var(--line)}
.row{display:flex;align-items:flex-start;flex-wrap:wrap;gap:8px;padding:3px 8px;border-radius:8px;min-height:32px}
.row.editing{background:var(--edit);outline:2px solid var(--accent)}
.row.deleted .view{text-decoration:line-through;color:var(--muted)}
.view code,.rec-text code,.ac-title code{font-family:var(--mono);font-size:.88em;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.row.raw .view{font-family:var(--mono);font-size:13px;color:var(--muted);cursor:default}
.bullet{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;margin-top:9px}
.bullet.square{border-radius:2px;background:var(--ink)}
.bullet.grip{position:relative;cursor:grab}
.bullet.grip::after{content:'';position:absolute;inset:-8px -7px}
.block.dragging{opacity:.4}
body.reordering,body.reordering *{cursor:grabbing!important;user-select:none}
#dropline{position:fixed;height:2px;background:var(--accent);border-radius:1px;pointer-events:none;z-index:60}
.bullet.ring{border-radius:2px;background:var(--bg);border:2px solid var(--ink)}
.row.editing .bullet{background:var(--accent)}
.body{flex:1 1 220px;min-width:0}
.view{cursor:text;min-height:24px;white-space:pre-wrap;word-break:break-word}
.view .cont{color:var(--ink2)}
.ph{color:var(--faint)}
.row textarea{display:none;width:100%;border:0;outline:0;background:transparent;resize:none;padding:0;margin:0;overflow:hidden;line-height:1.6}
.row.decl textarea{font-weight:600}
.row.editing textarea{display:block}
.row.editing .view{display:none}
.person{color:var(--person);font-weight:var(--tagw);cursor:pointer}.kind{color:var(--kind);cursor:pointer}
.person:hover,.kind:hover{text-decoration:underline}
.ref{background:var(--todo-bg);color:var(--todo);border-radius:6px;padding:0 6px;font-size:14px}
/* block 引用：带引号的原文，下方虚线提示可点；原记录删除后加删除线 */
.qref{color:var(--ink);border-bottom:1px dotted var(--line2);cursor:pointer}
.qref:hover{border-bottom-color:var(--accent)}
.qref.del{text-decoration:line-through;color:var(--faint)}
.qref.missing{color:var(--faint);font-style:italic;cursor:default}
/* 反向链接：行尾一个浅色的 ↩ N */
.bl{flex:none;font-size:11px;color:var(--faint);margin-top:5px;padding:0 5px;border:0;border-radius:5px;background:transparent;cursor:pointer;font-variant-numeric:tabular-nums}
.bl:hover{background:var(--line);color:var(--ink)}
.status{font-size:12px;font-weight:600;border:0;border-radius:6px;padding:2px 8px;margin-top:2px;white-space:nowrap}
.status.TODO{background:var(--todo-bg);color:var(--todo)}.status.WAIT{background:var(--wait-bg);color:var(--wait)}.status.DONE{background:var(--done-chip);color:var(--done-fg)}
.status-edit{font-family:var(--mono);font-size:12px;width:158px;border:1px solid var(--accent);border-radius:6px;padding:1px 6px;margin-top:2px;outline:0;background:var(--panel)}
.muted{color:var(--muted);font-size:13px}
.tag{font-size:11px;border-radius:9px;padding:1px 8px;margin-top:4px;white-space:nowrap}
.tag.line{border:1px solid var(--line2);color:var(--ink2);background:var(--panel)}
.tag.dash{border:1px dashed var(--muted);color:var(--ink2);background:var(--panel)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.err{background:var(--err-bg);color:var(--err)}
.mini{font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:1px 8px;margin-top:2px}
.mini.del{opacity:0;border-color:transparent;color:var(--muted)}
.row:hover .mini.del,.row.editing .mini.del,.mini.del:focus{opacity:1;border-color:var(--line)}
#add{margin:10px 0 0 8px;border:1px dashed var(--line2);background:var(--panel);color:var(--muted);border-radius:8px;padding:4px 12px;font-size:13px}
/* 补全菜单：和列表行同样紧凑——单行 26px、13px 字、选中用浅底色而不是反色 */
#ac,#tac,#rac,#blp{position:fixed;z-index:20;min-width:200px;max-width:min(360px,calc(100vw - 16px));max-height:252px;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:0 6px 18px var(--shadow);padding:3px;display:flex;flex-direction:column}
.ac-head{font-size:11px;color:var(--faint);padding:3px 8px 2px}
.ac-item{flex:none;display:flex;align-items:center;gap:12px;height:26px;padding:0 8px;border:0;border-radius:5px;background:transparent;font-size:13px;text-align:left;color:var(--ink);cursor:pointer}
.ac-item:hover{background:color-mix(in srgb,var(--line) 55%,transparent)}
.ac-item.on{background:var(--line)}
.ac-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-title b{font-weight:600}
.ac-date{flex:none;font:11px var(--mono);color:var(--faint)}
/* 引用搜索和反向链接列表放宽到 480px；宽度不够时先截所属项目，正文尽量完整 */
#rac,#blp{max-width:min(480px,calc(100vw - 16px));min-width:300px}
#rac .ac-title,#blp .ac-title{flex:1 1 auto;min-width:55%}
#rac .ac-sub,#blp .ac-sub{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
#rac.none .ac-item{cursor:default;color:var(--faint)}
#rac.none .ac-item.on,#rac.none .ac-item:hover{background:transparent}
.ac-sub{flex:none;font-size:11px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.ac-item.create .ac-title{color:var(--muted)}
.ac-item.create .ac-title::before{content:"+ "}
.ac-item:not(.create)+.ac-item.create{margin-top:4px;position:relative}
.ac-item:not(.create)+.ac-item.create::after{content:"";position:absolute;left:4px;right:4px;top:-3px;border-top:1px solid var(--line)}
#raw{margin:0;font-family:var(--mono);font-size:12px;line-height:1.75;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-all}
.ln .meta{color:var(--faint)}
.ln.chg{animation:flash 2.4s ease-out}
@keyframes flash{0%,35%{background:var(--warn-bg)}100%{background:transparent}}
/* 只读视图 */
#view{flex:1;min-height:0;overflow:auto;padding:16px 24px 80px}
#view h1{margin:0 0 14px;font-size:17px;font-weight:600}
#view h2{margin:22px 0 8px;font-size:12px;font-weight:600;color:var(--muted)}
#view h2.rec-head{display:flex;align-items:center;gap:8px}
.rec-head .icon-btn{width:24px;height:24px;padding:3px;margin:-6px 0 -6px auto}
.rec-head .icon-btn svg{width:16px;height:16px}
.rec-hidden{font-weight:400;color:var(--faint)}
.empty{color:var(--faint);font-size:13px;margin:4px 0}
.rec{position:relative;display:flex;align-items:baseline;gap:0 10px;padding:2px 32px 2px 6px;border-radius:6px;cursor:pointer}
.rec:hover,.rec.cur,.row.cur,.pj-head.cur,.grp-head.cur{background:var(--soft)}
.pj-head.cur .fold,.grp-head.cur .fold{background:var(--line);color:var(--ink)}
.row.cur.editing,.rec.cur.editing{background:var(--edit)}
.rec .status{margin:0;font-size:11px;padding:1px 7px}
.rec-date{font-family:var(--mono);font-size:12px;color:var(--faint);flex:none}
/* 正文至少占右侧区域的 60%；项目链放不下时整体换到正文下方（右对齐），不去挤正文 */
.rec-body{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px}
.rec-text{flex:1 1 60%;min-width:0;word-break:break-word}
.rec-path{display:flex;flex:0 1 auto;min-width:0;max-width:100%;margin-left:auto;font-size:12px;color:var(--faint);white-space:pre;cursor:pointer}
/* 宽度不够时先截上级：上级收缩系数极大，缩到最短之后才轮到末级。末级系数取 1 而不是更小——
   系数总和小于 1 时浏览器只收掉一部分溢出，名称会撑出列外 */
.rec-path .up{flex:0 10000 auto;min-width:1.5em;overflow:hidden;text-overflow:ellipsis}
.rec-path .leaf{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rec-path:hover{color:var(--ink2);text-decoration:underline}
.rec.editable{cursor:text}
.rec.editing{background:var(--edit);outline:2px solid var(--accent)}
.rec textarea{display:block;width:100%;border:0;outline:0;background:transparent;resize:none;padding:0;margin:0;overflow:hidden;line-height:1.6}
.goto{position:absolute;right:5px;top:4px;width:22px;height:22px;padding:3px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--faint);opacity:0;display:flex}
.goto svg{width:14px;height:14px}
.goto.in{position:static;flex:none}
.rec:hover .goto,.rec.editing .goto,.rec.cur .goto,.pj-head:hover .goto,.grp-head:hover .goto,.pj-head.cur .goto,.grp-head.cur .goto,.goto:focus-visible{opacity:1}
.goto:hover{border-color:var(--line2);background:var(--panel);color:var(--ink)}
.rec.deleted .rec-text{text-decoration:line-through;color:var(--muted)}
.rec.stale .status{outline:1.5px solid currentColor}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.col{min-width:0}
.col h2{margin-top:0!important}
.pj.top{margin-bottom:18px}
.pj-head{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:2px 6px 2px 2px;border-radius:8px;min-height:30px}
.pj-head.foldable{cursor:pointer}
.pj-head.foldable:hover{background:var(--soft)}
.pj-head.foldable:hover .fold{background:var(--line);color:var(--ink)}

<body>
<div id="gate">
  <h1>Worklog</h1>
  <p id="gate-msg">Choose the Worklog folder, the one that contains this file. Your records are kept there as plain text files, in its <code>data</code> folder.</p>
  <button class="btn primary" id="regrant" hidden></button>
  <button class="btn primary" id="pick">Choose workspace folder</button>
</div>
<div id="app" hidden>
  <nav id="nav" aria-label="Main">
    <div id="nav-head"><span id="brand">Worklog</span><button id="nav-toggle">«</button></div>
    <input id="q" type="search" placeholder="Search" title="Search (/)" aria-label="Search records">
    <div id="nav-items"></div>
    <span class="grow"></span>
    <button id="help-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
  </nav>
  <div id="col">
    <div id="banner" role="alert" hidden></div>
    <div id="journal">
      <header>
        <button class="btn sq" id="prev" title="Previous day" aria-label="Previous day">‹</button>
        <button class="btn sq" id="next" title="Next day" aria-label="Next day">›</button>
        <button class="btn" id="today" title="Go to today">Today</button>
        <h1 id="title" role="button" tabindex="0" title="Pick a date (D)" aria-haspopup="dialog"></h1>
        <span class="chip" id="file"></span>
        <span class="grow"></span>
        <button class="btn" id="side-toggle" title="Show file source" aria-pressed="false">Source</button>
      </header>
      <main>
        <section id="editor-wrap" aria-label="Journal">
          <div id="editor"></div>
          <button id="add">+ New block</button>
        </section>
        <aside id="side" hidden><pre id="raw"></pre></aside>
      </main>
    </div>
    <div id="view" hidden></div>
    <footer><span id="stats"></span><span class="grow"></span><span id="saved" role="status"></span></footer>
  </div>
</div>
<div id="ac" hidden></div>
<div id="tac" role="listbox" aria-label="Suggestions" hidden></div>
<div id="rac" role="listbox" aria-label="Records" hidden></div>
<div id="blp" role="listbox" aria-label="Referenced by" hidden></div>
<dialog id="help" aria-label="Keyboard shortcuts"></dialog>
<div id="dp" role="dialog" aria-label="Pick a date" hidden></div>
<div id="toast" role="status"></div><div id="dropline" hidden></div>
<script>
// Worklog 内核：模型、解析、正规化、序列化、块操作、内存索引。无依赖，可在 Node 中测试。
const ID_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const ID_RE = '[A-Za-z0-9_-]{10}';
const DATE_RE = '\\d{4}-\\d{2}-\\d{2}';
const SCHEMA = '0.3';
let keySeq = 0;

function randomId() {
  const a = new Uint8Array(10);
  crypto.getRandomValues(a);
  let s = '';
  for (let i = 0; i < 10; i++) s += ID_CHARS[a[i] & 63];
  return s;
}

// type: ord 普通记录 | proj 项目声明 | branch 分支声明 | head 项目标题块 | raw 无法识别的行（原样保留）
function mk(props) {
  return Object.assign({
    key: 'b' + (++keySeq), id: null, type: 'ord', date: null, status: null, statusDate: null,
    text: '', owner: null, proj: null, extParent: null, del: null, life: null, children: []
  }, props);
}

function newState() { return { pages: {}, ids: new Set(), ver: 0, pdiags: {}, diags: [] }; }
function bump(S) { S.ver++; }

function walk(list, fn, parent = null, depth = 0) {
  for (const b of list.slice()) { fn(b, parent, depth, list); walk(b.children, fn, b, depth + 1); }
}
function eachBlock(S, fn) { for (const d in S.pages) walk(S.pages[d], (b, parent) => fn(b, parent, d)); }

function find(S, key) {
  let hit = null;
  const search = (list, parent, page) => {
    for (let i = 0; i < list.length && !hit; i++) {
      if (list[i].key === key) { hit = { b: list[i], parent, list, index: i, page }; return; }
      search(list[i].children, list[i], page);
    }
  };
  for (const d in S.pages) { if (hit) break; search(S.pages[d], null, d); }
  return hit;
}

function flat(S, page) { const out = []; walk(S.pages[page] || [], (b) => out.push(b)); return out; }
function hasContent(b) { return b.type === 'head' || b.type === 'raw' || b.text.trim() !== ''; }
function newId(S) { let id; do { id = randomId(); } while (S.ids.has(id)); S.ids.add(id); return id; }
function validDate(s) {
  const [y, m, d] = s.split('-').map(Number), t = new Date(y, m - 1, d);
  return t.getFullYear() === y && t.getMonth() === m - 1 && t.getDate() === d;
}

// ---- 内存索引：按版本号缓存，结构变化后首次使用时重建 ----
const TAG_RE = /(?<![A-Za-z0-9\\])([@#])(?:\{([^}\n]+)\}|([A-Za-z][A-Za-z0-9_-]*(?:\.[A-Za-z0-9_-]+)*))/g;   // 名字中间允许点号：@Firstname.Lastname；句末的点不算
// 行内代码 `...`：里面的 @ # (( [[ 都只是文字。同一行里成对的反引号才算，扫描时先把代码段换成等长的空格，位置不变
const CODE_RE = /`[^`\n]*`/g;
function maskCode(t) { return t.indexOf('`') < 0 ? t : t.replace(CODE_RE, (x) => ' '.repeat(x.length)); }
function outsideCode(t, fn, keep = (x) => x) {   // 只对代码段以外的部分做 fn，代码段交给 keep
  if (t.indexOf('`') < 0) return fn(t);
  let out = '', i = 0, m; CODE_RE.lastIndex = 0;
  while ((m = CODE_RE.exec(t))) { out += fn(t.slice(i, m.index)) + keep(m[0]); i = m.index + m[0].length; }
  return out + fn(t.slice(i));
}
const inCode = (upto) => (upto.slice(upto.lastIndexOf('\n') + 1).split('`').length - 1) % 2 === 1;   // 光标前这一行有落单的反引号：正在代码里
const REC_RE = new RegExp(`\\(\\((${ID_RE})\\)\\)`, 'g');   // 正文里对别的记录的引用
const REF_RE = new RegExp(`\\[\\[PJ\\/[^\\]|\\[]+\\|(${ID_RE})\\]\\]|\\(\\((${ID_RE})\\)\\)`, 'g');
let cache = { S: null, ver: -1 };
function index(S) {
  if (cache.S === S && cache.ver === S.ver) return cache;
  const P = {}, byId = {}, tags = new Map(), refs = new Map(), byProj = new Map(), brefs = new Map();   // brefs：被 ((ID)) 引用的记录 → 引用它的记录
  const add = (map, k, v) => { let a = map.get(k); if (!a) map.set(k, a = []); a.push(v); };
  const go = (list, ctx, page) => {
    for (const b of list) {
      b.page = page;
      if (b.type === 'raw') { go(b.children, ctx, page); continue; }
      if (b.id) byId[b.id] = b;
      if (b.type === 'proj' || b.type === 'branch') { if (b.id) P[b.id] = { id: b.id, name: b.text, type: b.type, parent: b.owner, life: b.life, date: b.date }; }
      else if (b.type === 'ord') {
        b.own = ctx;   // 推导出的归属，随索引一起刷新
        // 反向链接不依赖引用方有没有 ID：刚写下、还没保存的记录也要立刻算上
        const tx = maskCode(b.text);
        if (tx.indexOf('((') >= 0) {
          const seen = new Set(); let r;
          REC_RE.lastIndex = 0;
          while ((r = REC_RE.exec(tx))) if (r[1] !== b.id && !seen.has(r[1])) { seen.add(r[1]); add(brefs, r[1], b); }
        }
        if (b.id) {
          add(byProj, ctx, b);
          // 同一条记录里同一个标签或引用出现几次都只登记一次，否则标签页会把这条记录列出好几遍
          let m; const seenTags = new Set(), seenRefs = new Set();
          TAG_RE.lastIndex = 0;
          while ((m = TAG_RE.exec(tx))) seenTags.add(m[1] + (m[2] || m[3]));
          REF_RE.lastIndex = 0;
          while ((m = REF_RE.exec(tx))) seenRefs.add(m[1] || m[2]);
          if (b.extParent) seenRefs.add(b.extParent);
          for (const t of seenTags) add(tags, t, b.id);
          for (const r of seenRefs) add(refs, r, b.id);
        }
      }
      go(b.children, childCtx(b, ctx), page);
    }
  };
  for (const d in S.pages) go(S.pages[d], 'INBOX', d);
  return (cache = { S, ver: S.ver, P, byId, tags, refs, byProj, brefs });
}
function projects(S) { return index(S).P; }
function recordsByTag(S, tag) { const ix = index(S); return (ix.tags.get(tag) || []).map((id) => ix.byId[id]); }
function referenced(S, id) { return !!id && (index(S).refs.get(id) || []).some((x) => x !== id); }

function projectPath(P, id) {
  const parts = []; let cur = P[id], guard = 0;
  while (cur && guard++ < 20) { parts.unshift(cur.name); cur = cur.type === 'branch' ? P[cur.parent] : null; }
  return parts.join(' / ');
}
function normName(s) { return s.normalize('NFC').trim().replace(/\s+/g, ' ').replace(/[A-Z]/g, (c) => c.toLowerCase()); }
function matchProjects(S, name) { const n = normName(name); return Object.values(projects(S)).filter((p) => normName(p.name) === n); }

// 归属由缩进推导：声明块和项目标题块为其下的记录提供项目，普通块沿用上层，顶层为 Inbox
function childCtx(b, ctx) { return b.type === 'head' ? b.proj : (b.type === 'ord' || b.type === 'raw' ? ctx : b.id); }
function ownerAt(S, key) {
  let found = 'INBOX';
  const go = (list, ctx) => { for (const b of list) { if (b.key === key) { found = ctx; return true; } if (go(b.children, childCtx(b, ctx))) return true; } return false; };
  for (const d in S.pages) if (go(S.pages[d], 'INBOX')) break;
  return found;
}

// ---- 正规化 ----
const RE_ST = new RegExp(`^\\[(TODO|WAIT|DONE)(?::(${DATE_RE}))?\\]\\s*`);
const RE_ST_END = new RegExp(`\\s*\\[(TODO|WAIT|DONE)(?::(${DATE_RE}))?\\]$`);
const RE_PURE = new RegExp(`^\\[\\[PJ\\/[^\\]|\\[]+\\|(${ID_RE})\\]\\]$`);

function normalizeRefs(S, text) {
  if (text.indexOf('[[') < 0) return text;
  return outsideCode(text, (part) => part.replace(/\[\[([^\[\]|]+)\]\]/g, (all, inner) => {
    if (/^\d{4}-\d{2}-\d{2}$/.test(inner)) return all;
    const hits = matchProjects(S, inner.replace(/^PJ\//, ''));
    return hits.length === 1 ? `[[PJ/${hits[0].name}|${hits[0].id}]]` : all;
  }));
}

// 失焦或结构操作前调用：只移动和补全字段，不改写正文
function commitBlock(S, b, today) {
  if (b.type === 'head' || b.type === 'raw') return;
  const before = b.text + '|' + b.status + '|' + b.type;
  if (b.type !== 'ord') b.text = b.text.replace(/[|\[\]\n]/g, '').normalize('NFC').trim();
  else {
    let t = b.text.replace(/^\n+/, '').replace(/\s+$/, '');
    const head = t.match(RE_ST), tail = head ? null : t.match(RE_ST_END);
    if (head) { b.status = head[1]; b.statusDate = head[2] && validDate(head[2]) ? head[2] : today; t = t.slice(head[0].length); }
    else if (tail) { b.status = tail[1]; b.statusDate = tail[2] && validDate(tail[2]) ? tail[2] : today; t = t.slice(0, t.length - tail[0].length); }
    b.text = normalizeRefs(S, t);
    const pure = b.text.match(RE_PURE);
    if (pure && !b.status && projects(S)[pure[1]]) { b.type = 'head'; b.proj = pure[1]; b.text = ''; }
  }
  if (before !== b.text + '|' + b.status + '|' + b.type) bump(S);
}

const FS = {
  dir: null, data: null, files: new Map(),   // date → { handle, mtime, size }

  supported() { return 'showDirectoryPicker' in window || !!window.__mockDir; },

  idb(mode, fn) {
    return new Promise((resolve, reject) => {
      const open = indexedDB.open('worklog', 1);
      open.onupgradeneeded = () => open.result.createObjectStore('kv');
      open.onerror = () => reject(open.error);
      open.onsuccess = () => {
        const tx = open.result.transaction('kv', mode), req = fn(tx.objectStore('kv'));
        tx.oncomplete = () => resolve(req && req.result);
        tx.onerror = () => reject(tx.error);
      };
    });
  },

  // 返回 'ready' | 'prompt'（已记住目录但需要点一下授权）| 'none'
  async restore() {
    if (window.__mockDir) { this.dir = window.__mockDir; return 'ready'; }
    try { this.dir = await this.idb('readonly', (s) => s.get('dir')); } catch (e) { this.dir = null; }
    if (!this.dir) return 'none';
    return (await this.dir.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'ready' : 'prompt';
  },
  async grant() { return (await this.dir.requestPermission({ mode: 'readwrite' })) === 'granted'; },
  async pick() {
    this.dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'worklog' });
    try { await this.idb('readwrite', (s) => s.put(this.dir, 'dir')); } catch (e) { /* 记不住也能用，下次重新选择 */ }
  },

  // 决定记录放在哪里，让"选了外层文件夹"和"直接选了 data"得到同一个结果，不再出现 data/data：
  //   1. 选中的文件夹里已有 data 子文件夹 → 用它
  //   2. 选中的文件夹本身叫 data，或里面直接放着日期文件 → 就用它本身
  //   3. 其他情况 → 在里面新建 data
  async locate() {
    const d = this.dir;
    let sub = null;
    try { sub = await d.getDirectoryHandle('data'); } catch (e) { /* 没有这个子文件夹 */ }
    if (!sub) {
      let own = d.name === 'data';
      if (!own && d.entries) for await (const [name, h] of d.entries()) if (h.kind === 'file' && /^\d{4}-\d{2}-\d{2}\.md$/.test(name)) { own = true; break; }
      if (!own) sub = await d.getDirectoryHandle('data', { create: true });
    }
    this.data = sub || d;
    this.where = sub ? d.name + '/data' : d.name;
  },

  // 读入 data/ 下全部日期文件，返回 [[date, text], …]
  async loadAll() {
    await this.locate();
    this.files.clear();
    const jobs = [];
    for await (const [name, handle] of this.data.entries()) {
      const m = handle.kind === 'file' && name.match(/^(\d{4}-\d{2}-\d{2})\.md$/);
      if (m) jobs.push(handle.getFile().then(async (f) => { this.files.set(m[1], { handle, mtime: f.lastModified, size: f.size }); return [m[1], await f.text()]; }));
    }
    return Promise.all(jobs);
  },

  // 磁盘上的文件自上次读写后是否被改过
  async changed(date) {
    const e = this.files.get(date);
    if (!e) return false;
    const f = await e.handle.getFile();
    return f.lastModified !== e.mtime || f.size !== e.size;
  },
  async read(date) {
    const e = this.files.get(date), f = await e.handle.getFile();
    e.mtime = f.lastModified; e.size = f.size;
    return f.text();
  },
  async write(date, text) {
    let e = this.files.get(date);
    if (!e) this.files.set(date, e = { handle: await this.data.getFileHandle(date + '.md', { create: true }), mtime: 0, size: 0 });
    const w = await e.handle.createWritable();   // 写入临时文件，close 时整体替换
    await w.write(text); await w.close();
    const f = await e.handle.getFile();
    e.mtime = f.lastModified; e.size = f.size;
  },
  age(date) { const e = this.files.get(date); return e ? Date.now() - e.mtime : Infinity; }
};

// Worklog 界面：Journal 块编辑器，接内核与本地目录。

const pad = (n) => String(n).padStart(2, '0');

const today = () => fmt(new Date());
const shiftDay = (s, n) => { const [y, m, d] = s.split('-').map(Number); return fmt(new Date(y, m - 1, d + n)); };
const WEEK = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

let S = newState(), cur = today(), readOnly = false, rendering = false, ac = null, origin = null;

// 外观由三项组合：THEMES 选亮暗（System 跟随系统），PALETTES 选色板，cfg.color 选着色强度（Full/Soft/Mono）。
// 登记在这里的名字会自动出现在 Settings；对应的变量写在 style.css

function applyTheme() { const r = document.documentElement; if (PALETTES[cfg.palette] && cfg.palette !== 'default') r.dataset.palette = cfg.palette; else delete r.dataset.palette; r.dataset.color = cfg.color; document.documentElement.dataset.theme = THEMES[cfg.theme] ? cfg.theme : (darkMq && darkMq.matches ? 'dark' : 'light'); }

const dirty = new Set(), force = new Set();

// ---- 保存：只写发生变化的那一个日期文件，写前校验磁盘上是否被改过 ----
function touch(immediate, date) {
  if (readOnly) return;
  dirty.add(date || cur);
  $('#saved').textContent = 'editing';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, immediate ? 0 : 400);
  if (showSide) updateSide();
}
function flush() {
  saving = saving.then(async () => {
    for (const date of [...dirty]) {
      try {
        ensureIds(S, today(), date);
        const text = serializePage(S, date);
        if (!FS.files.has(date) && !(S.pages[date] || []).some(hasContent)) { dirty.delete(date); continue; }
        if (!force.has(date) && await FS.changed(date)) { conflict(date); continue; }
        await FS.write(date, text);
        dirty.delete(date); force.delete(date);
      } catch (e) { banner('Save failed: ' + e.message + '. Your edits are still in the editor.', [['Retry', () => { banner(); flush(); }]]); return; }
    }
    if (!dirty.size) {
      const d = new Date(); $('#saved').textContent = `saved ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      if (!BK.hold && !lockedOut && FS.data) { BK.remember(FS.files.size, recordCount()); BK.daily(); }   // 跨过午夜一直开着时，第二天的第一次保存补做备份
    }
    if (showSide) updateSide();
  });
  return saving;
}
function conflict(date) {
  banner(`data/${date}.md was changed outside the app while you have unsaved edits.`, [
    ['Load disk version', async () => { banner(); dirty.delete(date); await reloadPage(date); }],
    ['Keep mine', () => { banner(); force.add(date); flush(); }]
  ]);
}
async function reloadPage(date) {
  loadPage(S, date, await FS.read(date), today());
  settle(S, today());
  if (view !== 'journal') drawView(); else if (date === cur) render();
  updateIssues();
}

// ---- 正文渲染 ----
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TOKEN = new RegExp(`(\\\\[@#\\[(^\\\\])|\\[\\[PJ\\/([^\\]|\\[]+)\\|(${ID_RE})\\]\\]|\\(\\((${ID_RE})\\)\\)|((?<![A-Za-z0-9])@(?:\\{[^}\\n]+\\}|[A-Za-z][A-Za-z0-9_-]*(?:\\.[A-Za-z0-9_-]+)*))|((?<![A-Za-z0-9])#(?:\\{[^}\\n]+\\}|[A-Za-z][A-Za-z0-9_-]*))`, 'g');
// 行内代码原样显示，里面的标签、引用都不解析
function richLine(line, P, byId) { return outsideCode(line, (part) => richPart(part, P, byId), (c) => `<code>${esc(c.slice(1, -1))}</code>`); }
function richPart(line, P, byId) {
  let out = '', i = 0, m;
  TOKEN.lastIndex = 0;
  while ((m = TOKEN.exec(line))) {
    out += esc(line.slice(i, m.index)); i = m.index + m[0].length;
    if (m[1]) out += esc(m[1].slice(1));
    else if (m[3]) out += `<span class="ref" data-pj="${m[3]}">${esc(P[m[3]] ? P[m[3]].name : m[2])}</span>`;
    else if (m[4]) out += refQuote(m[4], byId);
    else if (m[5]) out += `<span class="person">${esc(m[5].replace(/[{}]/g, ''))}</span>`;   // 花括号只是文件里的写法，显示时去掉
    else if (m[6]) out += `<span class="kind">${esc(m[6].replace(/[{}]/g, ''))}</span>`;
  }
  return out + esc(line.slice(i));
}
// ---- block 引用 ----
// 被引用记录第一行的纯文字：项目引用换成项目名、花括号去掉；它里面再引用别的记录时只展开一层
function refText(b, depth = 0) {
  const ix = index(S);
  return outsideCode(b.text.split('\n')[0], (t) => t
    .replace(new RegExp(`\\(\\((${ID_RE})\\)\\)`, 'g'), (all, id) => (depth < 1 && ix.byId[id] ? '“' + refText(ix.byId[id], depth + 1) + '”' : '…'))
    .replace(new RegExp(`\\[\\[PJ\\/([^\\]|\\[]+)\\|${ID_RE}\\]\\]`, 'g'), '$1')
    .replace(/([@#])\{([^}\n]+)\}/g, '$1$2'), (c) => c.slice(1, -1));   // 引文是纯文字：代码段只去掉反引号
}
function refWhere(b) { const P = index(S).P; return b.own && b.own !== 'INBOX' && P[b.own] ? projectPath(P, b.own) : 'Inbox'; }
// 正文里的 ((ID)) 显示成带引号的原文；悬停看日期和所属项目，点击跳回原记录
function refQuote(id, byId) {
  const r = byId[id];
  if (!r) return `<span class="qref missing" title="Record ${id} not found">“unknown record”</span>`;
  return `<span class="qref${r.del ? ' del' : ''}" data-rec="${id}" title="${esc(`${r.date} · ${refWhere(r)}${r.del ? ' · deleted' : ''} (click to open)`)}">“${esc(refText(r))}”</span>`;
}

function chipLabel(b) {
  if (cfg.chip === 'none' || !b.statusDate) return b.status;
  if (cfg.chip === 'date') return `${b.status} · ${b.statusDate.slice(5)}`;
  const [y, m, d] = b.statusDate.split('-').map(Number), n = Math.round((new Date(new Date().toDateString()) - new Date(y, m - 1, d)) / 86400000);
  return `${b.status} · ${n <= 0 ? 'today' : n + 'd'}`;
}

// ---- 渲染：只渲染当前页 ----
function ensurePage() {
  if (!S.pages[cur]) S.pages[cur] = [];
  if (!S.pages[cur].length && !readOnly) S.pages[cur].push(mk({ date: cur }));
}
// 已结束项目里的记录只读
function lockedBlock(b, st) {
  const id = b.type === 'ord' ? b.own : b.type === 'head' ? b.proj : b.id;
  return !!(id && st.N[id] && st.N[id].closed);
}
function render(focusKey, pos) {
  if (view !== 'journal') return;
  rendering = true; closeAc(); ensurePage();
  const [y, m, d] = cur.split('-').map(Number);
  $('#title').textContent = `${cur} ${WEEK[new Date(y, m - 1, d).getDay()]}`;
  const ix = index(S), root = $('#editor');
  ix.st = stats(S, today());
  root.textContent = '';
  const draw = (list, parent) => {
    const wrap = el('div', parent ? 'kids' : 'list');
    for (const b of list) {
      const node = el('div', 'block'); node.dataset.key = b.key;
      node.appendChild(drawRow(b, parent, ix));
      if (b.children.length) node.appendChild(draw(b.children, b));
      wrap.appendChild(node);
    }
    return wrap;
  };
  root.appendChild(draw(S.pages[cur], null));
  rendering = false;
  if (showSide) updateSide();
  markCur();
  if (focusKey) focusBlock(focusKey, pos);
}

function fillView(view, b, ix) {
  if (b.type === 'raw') view.textContent = b.text;
  else if (b.type === 'head') view.innerHTML = `<strong class="pjlink" data-pj="${b.proj}">${esc(ix.P[b.proj] ? projectPath(ix.P, b.proj) : (b.label || 'unknown project'))}</strong>`;
  else if (b.type !== 'ord') view.innerHTML = `<strong>${esc(b.text)}</strong>`;
  else if (!hasContent(b)) view.innerHTML = '<span class="ph">Type here. [[ for projects.</span>';
  else view.innerHTML = b.text.split('\n').map((l, i) => `<div class="${i ? 'cont' : ''}">${richLine(l, ix.P, ix.byId) || '&nbsp;'}</div>`).join('');
}

function drawRow(b, parent, ix) {
  const P = ix.P, locked = readOnly || lockedBlock(b, ix.st || (ix.st = stats(S, today())));
  const row = el('div', 'row' + (b.del ? ' deleted' : '') + (b.type === 'raw' ? ' raw' : b.type !== 'ord' ? ' decl' : ''));
  const bul = el('span', 'bullet' + (b.type === 'head' ? ' ring' : b.type === 'proj' || b.type === 'branch' ? ' square' : ''));
  row.appendChild(bul);
  if (!locked && !b.del) dragBullet(bul, b);
  if (b.type === 'ord' && b.status) {
    const st = el('button', 'status ' + b.status, chipLabel(b));
    st.title = `Edit status · ${b.status} since ${b.statusDate}`;
    if (!b.del && !locked) st.onclick = () => editStatus(b, st);
    row.appendChild(st);
  }
  const body = el('div', 'body'), view = el('div', 'view');
  fillView(view, b, ix);
  body.appendChild(view);
  if (b.type !== 'raw') {
    const ta = el('textarea'); ta.rows = 1; ta.spellcheck = false;
    ta.value = b.type === 'head' ? (P[b.proj] ? projectPath(P, b.proj) : (b.label || 'unknown project')) : b.text;
    ta.setAttribute('aria-label', b.type === 'head' ? 'Project heading' : b.type !== 'ord' ? 'Project name' : 'Record');
    if (locked || b.del || b.dup || b.type === 'head') ta.readOnly = true;
    view.onclick = (e) => { if (jump(e)) return; focusBlock(b.key, b.text.length); };
    ta.onfocus = () => { row.classList.add('editing'); grow(ta); };
    ta.onfocus = () => { ta._t0 = ta.value; };   // 记下进入编辑时的文字，退出时据此判断有没有改过
    ta.onblur = (e) => onBlur(e, b, row, parent);
    ta.oninput = (e) => { if (ta.readOnly) return; pairBrackets(ta, e); checkRef(ta, e, b); b.text = ta.value; grow(ta); touch(false); checkAc(b, ta); checkDate(ta); checkTag(ta); };
    ta.addEventListener('keydown', (e) => { if (codeKeys(ta, e)) return; if (!ta.readOnly && pairKeys(ta, e)) { b.text = ta.value; grow(ta); touch(false); checkAc(b, ta); } });
    ta.onkeydown = (e) => onKey(e, b, ta);

  if (b.type === 'proj') bul.title = `Project, created ${b.date}`;
  if (b.type === 'head') bul.title = 'Project heading';
  if (b.type === 'branch') {
    const pname = P[b.owner] ? P[b.owner].name : 'unknown';
    bul.title = `Branch of ${pname}, created ${b.date}`;

  }

  if (b.dup) row.appendChild(el('span', 'tag err', 'duplicate ID'));

    const a = el('button', 'mini', 'Keep ' + name(now)); a.onclick = () => resolve(b, false); row.appendChild(a);
    if (P[b.conflict]) { const c = el('button', 'mini', 'Move to ' + name(b.conflict)); c.onclick = () => resolve(b, true); row.appendChild(c); }
  }

    const own = ownerAt(S, b.key), name = lone[1].trim();

    const make = (label, kind, ctx) => { const x = el('button', 'mini', label); x.onclick = () => { b.text = ''; createProject(S, b.key, name, kind, ctx); touch(true); render(b.key, 0); }; row.appendChild(x); };
    if (own !== 'INBOX' && P[own]) make('New branch of ' + P[own].name, 'branch', own);
    make('New project', 'proj', null);
  }
  if (b.type === 'ord' && !parent && hasContent(b)) row.appendChild(el('span', 'tag dash', 'Inbox'));
  if (b.extParent) row.appendChild(el('span', 'tag line', '↳ ' + (ix.byId[b.extParent] ? ix.byId[b.extParent].text.split('\n')[0].slice(0, 16) : b.extParent)));
  if (b.date !== cur) row.appendChild(el('span', 'tag line', b.date.slice(5)));
  if (b.id && b.type === 'ord' && !b.del) { const bl = (ix.brefs.get(b.id) || []).filter((x) => !x.del); if (bl.length) row.appendChild(backlinkBtn(b, bl)); }   // 被别的记录引用

  } else if (b.type !== 'raw' && !locked) {
    const x = el('button', 'mini del', '×'); tip(x, 'Delete block');
    x.onmousedown = (e) => e.preventDefault();
    x.onclick = () => { const r = deleteBlock(S, b.key, today()); toast(r.msg); if (r.ok) { touch(true); render(); } };
    row.appendChild(x);
  }
  return row;
}

function resolve(b, byMark) { resolveConflict(S, b.key, byMark); settle(S, today()); touch(true); render(); updateIssues(); }
function grow(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

function focusBlock(key, pos) {
  const node = document.querySelector(`.block[data-key="${key}"] > .row`), ta = node && node.querySelector('textarea');
  if (!ta) return;
  navCur = key; setCur(node);
  node.classList.add('editing');
  ta.focus(); grow(ta);
  const p = pos == null ? ta.value.length : Math.min(pos, ta.value.length);
  ta.setSelectionRange(p, p);
}

function onBlur(e, b, row, parent) {
  if (rendering || !row.isConnected) return;
  closeAc(); origin = null;
  const v = S.ver, ta = e.target;
  // 只改了文字时 commitBlock 不一定让索引失效；这里补上，标签页、补全候选、反向链接才会立刻更新，也会立即保存
  if (!readOnly && ta && ta._t0 !== undefined && ta._t0 !== ta.value) { ta._t0 = ta.value; bump(S); }
  if (!readOnly) commitBlock(S, b, today());
  const ix = index(S);
  if (e.relatedTarget && row.contains(e.relatedTarget)) { row.classList.remove('editing'); fillView(row.querySelector('.view'), b, ix); if (b.type === 'ord') row.querySelector('textarea').value = b.text; }
  else { row.replaceWith(drawRow(b, parent, ix)); markCur(); }
  if (v !== S.ver) { touch(true); refreshBacklinks(); }
}

// 快捷键循环切换：进入新状态写当天日期，切回本次编辑开始时的状态则恢复原日期
function cycle(b) {
  if (!origin || origin.key !== b.key) origin = { key: b.key, status: b.status, date: b.statusDate };
  if (!cycleStatus(S, b.key, today())) return false;
  if (b.status === origin.status) b.statusDate = origin.date;
  return true;
}

// 点击状态标签：编辑 [TODO:2026-11-13] 这段原文
function editStatus(b, chip) {

      else toast('Use the form [TODO:2026-11-13] with TODO, WAIT or DONE. Nothing was changed');
      origin = null; bump(S); touch(true);
    }

async function releaseWorkspaceLock() {
  const lock = workspaceLock;
  if (!lock) return;
  workspaceLock = null;
  lock.release();
  await lock.done;
}

async function acquireWorkspaceLock() {
  if (!navigator.locks) return true;
  const name = 'worklog:' + FS.dir.name;
  if (workspaceLock?.name === name) return true;
  await releaseWorkspaceLock();
  return new Promise((resolve, reject) => {
    const done = navigator.locks.request(name, { ifAvailable: true }, (lock) => {

        resolve(true);

    });
    done.catch(reject);
  });

  if (openingWorkspace) return;
  const app = $('#app');
  let loading = false;
  openingWorkspace = app.inert = true;
  try {
    if (dirty.size) {
      await flush();
      if (dirty.size) return;
    }
    if (await select() === false) return;
    loading = true;
    await start();
    loading = false;
    if (afterOpen) afterOpen();
  } catch (e) {

// ---- 本地备份 ----
// 三层：1) 每天第一次打开时，把全部记录打成一个文件、gzip 压缩，存到 data 旁边的 backups/，保留最近 14 份；

  async dir(create) {

    a.href = url; a.download = `worklog-backup-${this.stamp()}.worklog.gz`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    return a.download;
  }
};

// 数据骤减时的提示：不写任何文件，直到用户选择恢复或保持现状
function holdBanner() {
  const h = BK.hold;
  banner(`The data folder now has ${h.files} ${h.files === 1 ? 'file' : 'files'}, but had ${h.prev.files} on ${h.prev.date}. If it was replaced by mistake, restore a backup. Nothing is saved until you choose.`,
    [['Restore a backup', () => show('issues')], ['Keep as is', () => { BK.hold = null; readOnly = lockedOut; banner(); BK.remember(FS.files.size, recordCount()); BK.daily(); render(); drawView(); }]]);
}
function recordCount() { let n = 0; eachBlock(S, () => n++); return n; }

// Maintenance 页里的备份一节
async function drawBackups(root) {
  root.appendChild(el('h2', null, 'Backups'));
  const info = el('div', 'set-row'), now = el('button', 'btn', 'Back up now');
  info.append(el('span', 'bk-note', `Daily, latest ${BK.KEEP} kept, in ${BK.where()}`), now);
  now.disabled = readOnly || !FS.files.size;
  now.onclick = async () => { now.disabled = true; try { const r = await BK.make(`${BK.stamp()}.worklog.gz`); toast(`Backed up ${r.files} files (${kb(r.size)})`); } catch (e) { toast('Backup failed: ' + e.message); } drawView(); };
  root.appendChild(info);
  const box = el('div', 'bk-list'); root.appendChild(box);
  const [all, copy] = await Promise.all([BK.list(), BK.browserCopy()]);
  if (!box.isConnected) return;   // 等待期间页面已重画
  if (!all.length && !copy) box.appendChild(empty('No backups yet.'));
  const row = (label, meta, src) => {
    const r = el('div', 'bk-row'), b = el('button', 'mini', 'Restore');
    r.append(el('span', 'bk-name', label), el('span', 'bk-meta', meta), b);
    let armed = 0;   // 两步确认：第一次点击只是提示，4 秒内再点一次才恢复
    b.disabled = lockedOut;
    b.onclick = async () => {
      if (Date.now() - armed > 4000) { armed = Date.now(); b.textContent = 'Click again to restore'; b.classList.add('arm'); setTimeout(() => { if (b.isConnected) { b.textContent = 'Restore'; b.classList.remove('arm'); } }, 4000); return; }
      b.disabled = true; b.textContent = 'Restoring…';
      try { await BK.restore(src); } catch (e) { toast('Restore failed: ' + e.message); drawView(); }
    };
    box.appendChild(r);
  };
  for (const b of all) row(b.name.replace('.worklog.gz', ''), `${kb(b.size)} · ${when(b.mtime)}`, { handle: b.handle, label: b.name });
  if (copy) row('Browser copy', `${copy.files} files · ${kb(copy.blob.size)} · ${when(copy.at)}`, { blob: copy.blob, label: 'the browser copy' });
}
const when = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const kb = (n) => (n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB');
</script>
</body>
</html>
