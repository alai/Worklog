<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worklog</title>
<style>
/* 主题 = 一组变量。新增主题：复制一段 :root[data-theme=…]，再到 app.js 的 THEMES 里登记名字 */
:root,:root[data-theme=light]{--bg:#fff;--panel:#fff;--ink:#1C2024;--ink2:#3A434C;--muted:#5B6570;--faint:#8A939D;--line:#E3E6EA;--line2:#C9CED4;--soft:#F6F7F9;--accent:#2459D6;--on:#fff;--edit:#F3F6FE;--kind0:#6B3FA0;
--todo-bg0:#E4ECFD;--todo0:#1B47B5;--wait-bg0:#FCEBD3;--wait0:#8A4B00;--done-bg:#E6EAEE;--done:#4A545E;--warn-bg:#FFF1C7;--warn:#6B4E00;--err-bg:#FDE3E1;--err:#9B1C13;--ok-bg0:#DDF3E4;--ok0:#17603A;--shadow:rgba(28,32,36,.14);
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:light}
:root[data-theme=dark]{--bg:#15181C;--panel:#1C2025;--ink:#E6E9EC;--ink2:#C3C9CF;--muted:#98A2AC;--faint:#6F7882;--line:#2B3138;--line2:#3B434C;--soft:#1C2025;--accent:#7AA2FF;--on:#15181C;--edit:#1D2638;--kind0:#C3A0F0;
--todo-bg0:#1E2C4D;--todo0:#A9C2FF;--wait-bg0:#41301A;--wait0:#F2C078;--done-bg:#2A3038;--done:#A6AFB8;--warn-bg:#40361A;--warn:#F0D684;--err-bg:#472220;--err:#FFB1AA;--ok-bg0:#1B3A29;--ok0:#8ED8A9;--shadow:rgba(0,0,0,.5);color-scheme:dark}
/* 颜色风格：只管着色的文字和标签（人名、类型、状态、项目引用、胶囊），不动背景和界面本身 */
:root{--person:var(--accent);--kind:var(--kind0);--todo:var(--todo0);--todo-bg:var(--todo-bg0);--wait:var(--wait0);--wait-bg:var(--wait-bg0);--ok:var(--ok0);--ok-bg:var(--ok-bg0);--done-fg:var(--done);--done-chip:var(--done-bg);--tagw:400}
:root[data-color=soft]{--person:color-mix(in srgb,var(--accent) 45%,var(--muted));--kind:color-mix(in srgb,var(--kind0) 45%,var(--muted));--todo:color-mix(in srgb,var(--todo0) 50%,var(--muted));--todo-bg:color-mix(in srgb,var(--todo-bg0) 45%,var(--soft));--wait:color-mix(in srgb,var(--wait0) 50%,var(--muted));--wait-bg:color-mix(in srgb,var(--wait-bg0) 45%,var(--soft));--ok:color-mix(in srgb,var(--ok0) 50%,var(--muted));--ok-bg:color-mix(in srgb,var(--ok-bg0) 45%,var(--soft))}
:root[data-color=mono]{--person:var(--ink);--kind:var(--muted);--todo:var(--on);--todo-bg:var(--ink2);--wait:var(--ink);--wait-bg:var(--line2);--ok:var(--muted);--ok-bg:var(--line);--done-fg:var(--faint);--done-chip:var(--soft);--tagw:600}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
#gate{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#gate h1{margin:0;font-size:22px;font-weight:600}
#gate p{margin:0;color:var(--muted);max-width:460px}
#app{height:100%;display:flex}
#col{flex:1;min-width:0;display:flex;flex-direction:column}
#journal{flex:1;min-height:0;display:flex;flex-direction:column}
/* 侧栏 */
#nav{flex:0 0 200px;display:flex;flex-direction:column;gap:8px;padding:10px;border-right:1px solid var(--line);background:var(--soft)}
#nav-head{display:flex;align-items:center;justify-content:space-between;height:32px;padding-left:8px}
#brand{font-weight:600}
#nav-toggle{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:6px}
#nav-toggle:hover{background:var(--line)}
#q{height:32px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 10px;font-size:13px}
#nav-items{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:8px;background:transparent;font-size:14px;text-align:left;color:var(--ink2)}
.nav-item:hover{background:var(--line)}
.nav-item.on{background:var(--ink);color:var(--on)}
.nav-label{flex:1}
.ico{width:22px;height:22px;flex:none}
.count{min-width:18px;padding:0 5px;border-radius:9px;background:var(--line);color:var(--muted);font-size:11px;font-weight:600;text-align:center;line-height:18px}
.count.warn{background:var(--warn-bg);color:var(--warn)}
#nav.narrow{flex-basis:56px;padding:10px 8px}
#nav.narrow #brand,#nav.narrow #q,#nav.narrow .nav-label,#nav.narrow .count{display:none}
#nav.narrow #nav-head{padding:0;justify-content:center}
#nav.narrow .nav-item{justify-content:center;padding:0}
/* 日志页 */
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line)}
header h1{margin:0 6px;font-size:17px;font-weight:600}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px}
.btn:hover{background:var(--soft)}
.btn.primary{height:40px;padding:0 18px;background:var(--ink);color:var(--on);border-color:var(--ink);font-size:14px}
.btn.sq{width:32px;padding:0;font-size:16px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--on);border-color:var(--ink)}
.chip{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--soft);border-radius:6px;padding:2px 8px}
.grow{flex:1}
#banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px;background:var(--warn-bg);color:var(--warn);font-size:14px}
main{flex:1;display:flex;min-height:0}
#editor-wrap{flex:1 1 0;min-width:0;overflow:auto;padding:16px 20px 80px}
#side{flex:0 0 44%;max-width:640px;border-left:1px solid var(--line);background:var(--soft);overflow:auto;padding:14px 16px}
footer{display:flex;gap:12px;padding:3px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);font-family:var(--mono)}
#saved{opacity:.75}
.kids{margin-left:11px;padding-left:19px;border-left:1px solid var(--line)}
.row{display:flex;align-items:flex-start;flex-wrap:wrap;gap:8px;padding:3px 8px;border-radius:8px;min-height:32px}
.row.editing{background:var(--edit);outline:2px solid var(--accent)}
.row.deleted .view{text-decoration:line-through;color:var(--muted)}
.row.raw .view{font-family:var(--mono);font-size:13px;color:var(--muted);cursor:default}
.bullet{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;margin-top:9px}
.bullet.square{border-radius:2px;background:var(--ink)}
.bullet.ring{border-radius:2px;background:var(--bg);border:2px solid var(--ink)}
.row.editing .bullet{background:var(--accent)}
.body{flex:1 1 220px;min-width:0}
.view{cursor:text;min-height:24px;white-space:pre-wrap;word-break:break-word}
.view .cont{color:var(--ink2)}
.ph{color:var(--faint)}
.row textarea{display:none;width:100%;border:0;outline:0;background:transparent;resize:none;padding:0;margin:0;overflow:hidden;line-height:1.6}
.row.decl textarea{font-weight:600}
.row.editing textarea{display:block}
.row.editing .view{display:none}
.person{color:var(--person);font-weight:var(--tagw);cursor:pointer}.kind{color:var(--kind);cursor:pointer}
.person:hover,.kind:hover{text-decoration:underline}
.ref{background:var(--todo-bg);color:var(--todo);border-radius:6px;padding:0 6px;font-size:14px}
.ref.rec{background:var(--done-bg);color:var(--ink2)}
.status{font-size:12px;font-weight:600;border:0;border-radius:6px;padding:2px 8px;margin-top:2px;white-space:nowrap}
.status.TODO{background:var(--todo-bg);color:var(--todo)}.status.WAIT{background:var(--wait-bg);color:var(--wait)}.status.DONE{background:var(--done-chip);color:var(--done-fg)}
.status-edit{font-family:var(--mono);font-size:12px;width:158px;border:1px solid var(--accent);border-radius:6px;padding:1px 6px;margin-top:2px;outline:0;background:var(--panel)}
.muted{color:var(--muted);font-size:13px}
.tag{font-size:11px;border-radius:9px;padding:1px 8px;margin-top:4px;white-space:nowrap}
.tag.line{border:1px solid var(--line2);color:var(--ink2);background:var(--panel)}
.tag.dash{border:1px dashed var(--muted);color:var(--ink2);background:var(--panel)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.err{background:var(--err-bg);color:var(--err)}
.mini{font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:1px 8px;margin-top:2px}
.mini.del{opacity:0;border-color:transparent;color:var(--muted)}
.row:hover .mini.del,.row.editing .mini.del,.mini.del:focus{opacity:1;border-color:var(--line)}
#add{margin:10px 0 0 8px;border:1px dashed var(--line2);background:var(--panel);color:var(--muted);border-radius:8px;padding:4px 12px;font-size:13px}
#ac{position:fixed;z-index:20;width:380px;max-width:calc(100vw - 16px);background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px}
.ac-item{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;border-radius:6px;background:var(--panel);padding:6px 10px}
.ac-item.create{border-top:1px solid var(--line);border-radius:0 0 6px 6px}
.ac-item.on{background:var(--ink);color:var(--on)}
.ac-title{font-weight:600}.ac-sub{font-size:13px;color:var(--muted)}.ac-item.on .ac-sub{color:var(--on)}
#raw{margin:0;font-family:var(--mono);font-size:12px;line-height:1.75;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-all}
.ln .meta{color:var(--faint)}
.ln.chg{animation:flash 2.4s ease-out}
@keyframes flash{0%,35%{background:var(--warn-bg)}100%{background:transparent}}
/* 只读视图 */
#view{flex:1;min-height:0;overflow:auto;padding:16px 24px 80px}
#view h1{margin:0 0 14px;font-size:17px;font-weight:600}
#view h2{margin:22px 0 8px;font-size:12px;font-weight:600;color:var(--muted)}
.empty{color:var(--faint);font-size:13px;margin:4px 0}
.rec{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;padding:2px 32px 2px 6px;border-radius:6px;cursor:pointer}
.rec:hover,.rec.cur,.row.cur,.pj-head.cur,.grp-head.cur{background:var(--soft)}
.pj-head.cur .fold,.grp-head.cur .fold{background:var(--line);color:var(--ink)}
.row.cur.editing,.rec.cur.editing{background:var(--edit)}
.rec .status{margin:0;font-size:11px;padding:1px 7px}
.rec-date{font-family:var(--mono);font-size:12px;color:var(--faint);flex:none}
.rec-text{flex:1 1 7em;min-width:0;word-break:break-word}
.rec-path{display:flex;flex:0 1 auto;min-width:0;max-width:100%;margin-left:auto;font-size:12px;color:var(--faint);white-space:pre;cursor:pointer}
.rec-path .up{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rec-path .leaf{flex:0 1 auto;min-width:3em;overflow:hidden;text-overflow:ellipsis}
.rec-path:hover{color:var(--ink2);text-decoration:underline}
.rec.editable{cursor:text}
.rec.editing{background:var(--edit);outline:2px solid var(--accent)}
.rec textarea{display:block;width:100%;border:0;outline:0;background:transparent;resize:none;padding:0;margin:0;overflow:hidden;line-height:1.6}
.goto{position:absolute;right:5px;top:4px;width:22px;height:22px;padding:3px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--faint);opacity:0;display:flex}
.goto svg{width:14px;height:14px}
.goto.in{position:static;flex:none}
.rec:hover .goto,.rec.editing .goto,.rec.cur .goto,.pj-head:hover .goto,.grp-head:hover .goto,.pj-head.cur .goto,.grp-head.cur .goto,.goto:focus-visible{opacity:1}
.goto:hover{border-color:var(--line2);background:var(--panel);color:var(--ink)}
.rec.deleted .rec-text{text-decoration:line-through;color:var(--muted)}
.rec.stale .status{outline:1.5px solid currentColor}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.col{min-width:0}
.col h2{margin-top:0!important}
.pj.top{margin-bottom:18px}
.pj-head{display:flex;align-items:center;gap:8px;padding:2px 6px 2px 2px;border-radius:8px;min-height:30px}
.pj-head.foldable{cursor:pointer}
.pj-head.foldable:hover{background:var(--soft)}
.pj-head.foldable:hover .fold{background:var(--line);color:var(--ink)}
.fold{border:0;background:transparent;color:var(--muted);width:24px;height:24px;padding:4px;border-radius:6px;flex:none;display:flex}
.fold svg{width:16px;height:16px;transition:transform .12s}
.fold.open svg{transform:rotate(90deg)}
.fold:hover{background:var(--line2)!important}
.pj-name{border:0;background:transparent;padding:0;font-weight:600;text-align:left}
.pj-name:hover{text-decoration:underline}
.pj-count{font-weight:600}
.pj-meta{font-size:11px;color:var(--faint)}
.cap{font-size:10px;border-radius:9px;padding:0 7px;line-height:16px}
.cap.ongoing{background:var(--wait-bg);color:var(--wait)}.cap.ready{background:var(--done-bg);color:var(--done)}.cap.completed{background:var(--ok-bg);color:var(--ok)}.cap.archived{background:var(--done-bg);color:var(--done)}
.mini.act{opacity:0;margin:0;border-color:transparent;background:transparent;color:var(--faint);font-size:11px}
.mini.act:hover{border-color:var(--line2);color:var(--ink);background:var(--panel)}
.pj-head:hover .mini.act,.mini.act:focus{opacity:1}
.pj-body{margin-left:13px;padding:2px 0 2px 14px;border-left:1px solid var(--line2)}
.pj-body>.pj{margin-top:4px}
.more{border:0;background:transparent;color:var(--faint);font-size:12px;padding:0 6px}
.more:hover{text-decoration:underline}
.issue{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:3px 6px;border-radius:6px;font-size:14px}
.issue:hover{background:var(--soft)}
.lvl{flex:0 0 44px;font-size:11px;font-weight:600;border-radius:9px;text-align:center}
.issue.warn .lvl{background:var(--warn-bg);color:var(--warn)}.issue.error .lvl,.issue.block .lvl{background:var(--err-bg);color:var(--err)}
.set-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);max-width:640px}
.set-label{flex:0 0 160px;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:32px}
.seg button{border:0;border-left:1px solid var(--line);background:var(--panel);padding:0 12px;font-size:13px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on)}
.set-row input{height:32px;width:80px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px}
#view h1{display:flex;align-items:center;gap:14px}
.seg.small{height:26px;font-weight:400}.seg.small button{font-size:12px;padding:0 10px}
.pj.acc{margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.graph{overflow-x:auto;margin:4px 0 6px}
.graph svg{display:block}
.g-grid{stroke:var(--line);stroke-width:1}
.g-tick{font:10px var(--mono);fill:var(--faint)}
.g-line{stroke:var(--line2);stroke-width:2;fill:none;stroke-linecap:round}
.g-line.done{stroke:var(--ok)}
.g-end{fill:var(--ok)}
.g-name{font-size:13px;fill:var(--ink2);cursor:pointer}.g-name.main{font-weight:600;fill:var(--ink)}
.g-name:hover{text-decoration:underline}
.g-meta{font-size:11px;fill:var(--faint)}
.g-dot{fill:var(--ink);stroke:var(--bg);stroke-width:1.5;cursor:pointer}
.g-dot:hover{fill:var(--person)}
.crumb{font-size:12px;color:var(--faint);margin-bottom:4px}
.link{border:0;background:transparent;padding:0;color:var(--muted);font-size:12px}.link:hover{text-decoration:underline}
.pj-head.page{margin-bottom:10px;padding-left:0}.pj-head.page .pj-name{font-size:17px}.pj-head.page .mini.act{opacity:1}
.day{font-family:var(--mono);font-size:12px;color:var(--faint);margin:10px 0 2px 6px}
.pjlink,.ref[data-pj]{cursor:pointer}.pjlink:hover{text-decoration:underline}
.btn.small{height:26px;font-size:12px;font-weight:400;padding:0 10px}
#view h1 .pj-count{font-weight:400;color:var(--faint);font-size:14px;margin-left:-6px}
#view .group{display:flex;align-items:center;gap:8px;border-radius:8px;padding:2px 6px 2px 2px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);margin:16px 0 4px}
.icon-btn{width:28px;height:28px;padding:4px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--faint);display:flex}
.icon-btn svg{width:18px;height:18px}
.icon-btn.sort.up svg{transform:scaleY(-1)}
#view h1 .icon-btn+.icon-btn{margin-left:-8px}
.icon-btn:hover{background:var(--soft);color:var(--ink);border-color:var(--line)}
.icon-btn[aria-pressed="true"]{background:var(--line);color:var(--ink)}
#view .group:hover{background:var(--soft)}
#help-btn{align-self:flex-start;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--muted);font-size:13px;margin-left:5px}
#help-btn:hover{background:var(--line);color:var(--ink)}
#nav.narrow #help-btn{align-self:center;margin:0}
#help{border:1px solid var(--line2);border-radius:12px;background:var(--panel);color:var(--ink);padding:18px 22px;width:min(720px,calc(100vw - 32px));box-shadow:0 12px 40px var(--shadow)}
#help::backdrop{background:rgba(0,0,0,.35)}
.help-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
.help-grid h2{margin:14px 0 6px;font-size:12px;font-weight:600;color:var(--muted)}
.help-row{display:flex;gap:12px;align-items:baseline;padding:2px 0;font-size:13px}
.help-row kbd{flex:0 0 138px;font:12px var(--mono);color:var(--ink2);background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:pre}
@media (max-width:640px){.help-grid{grid-template-columns:1fr}}
.set-val{font-size:14px;color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:var(--ink);color:var(--on);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
#toast.show{opacity:1}
@media (max-width:900px){main{flex-direction:column}#side{flex:none;max-width:none;border-left:0;border-top:1px solid var(--line)}.cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="gate">
  <h1>Worklog</h1>
  <p id="gate-msg">Choose the Worklog folder, the one that contains this file. Your records are kept there as plain text files, in its <code>data</code> folder.</p>
  <button class="btn primary" id="regrant" hidden></button>
  <button class="btn primary" id="pick">Choose workspace folder</button>
</div>
<div id="app" hidden>
  <nav id="nav" aria-label="Main">
    <div id="nav-head"><span id="brand">Worklog</span><button id="nav-toggle">«</button></div>
    <input id="q" type="search" placeholder="Search" title="Search (/)" aria-label="Search records">
    <div id="nav-items"></div>
    <span class="grow"></span>
    <button id="help-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
  </nav>
  <div id="col">
    <div id="banner" role="alert" hidden></div>
    <div id="journal">
      <header>
        <button class="btn sq" id="prev" title="Previous day" aria-label="Previous day">‹</button>
        <button class="btn sq" id="next" title="Next day" aria-label="Next day">›</button>
        <button class="btn" id="today" title="Go to today">Today</button>
        <h1 id="title"></h1>
        <span class="chip" id="file"></span>
        <span class="grow"></span>
        <button class="btn" id="side-toggle" title="Show file source" aria-pressed="false">Source</button>
      </header>
      <main>
        <section id="editor-wrap" aria-label="Journal">
          <div id="editor"></div>
          <button id="add">+ New block</button>
        </section>
        <aside id="side" hidden><pre id="raw"></pre></aside>
      </main>
    </div>
    <div id="view" hidden></div>
    <footer><span id="stats"></span><span class="grow"></span><span id="saved" role="status"></span></footer>
  </div>
</div>
<div id="ac" hidden></div>
<dialog id="help" aria-label="Keyboard shortcuts"></dialog>
<div id="toast" role="status"></div>
<script>
// Worklog 内核：模型、解析、正规化、序列化、块操作、内存索引。无依赖，可在 Node 中测试。
const ID_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const ID_RE = '[A-Za-z0-9_-]{10}';
const DATE_RE = '\\d{4}-\\d{2}-\\d{2}';
const SCHEMA = '0.3';
let keySeq = 0;

function randomId() {
  const a = new Uint8Array(10);
  crypto.getRandomValues(a);
  let s = '';
  for (let i = 0; i < 10; i++) s += ID_CHARS[a[i] & 63];
  return s;
}

// type: ord 普通记录 | proj 项目声明 | branch 分支声明 | head 项目标题块 | raw 无法识别的行（原样保留）
function mk(props) {
  return Object.assign({
    key: 'b' + (++keySeq), id: null, type: 'ord', date: null, status: null, statusDate: null,
    text: '', owner: null, proj: null, extParent: null, del: null, life: null, children: []
  }, props);
}

function newState() { return { pages: {}, ids: new Set(), ver: 0, pdiags: {}, diags: [] }; }
function bump(S) { S.ver++; }

function walk(list, fn, parent = null, depth = 0) {
  for (const b of list.slice()) { fn(b, parent, depth, list); walk(b.children, fn, b, depth + 1); }
}
function eachBlock(S, fn) { for (const d in S.pages) walk(S.pages[d], (b, parent) => fn(b, parent, d)); }

function find(S, key) {
  let hit = null;
  const search = (list, parent, page) => {
    for (let i = 0; i < list.length && !hit; i++) {
      if (list[i].key === key) { hit = { b: list[i], parent, list, index: i, page }; return; }
      search(list[i].children, list[i], page);
    }
  };
  for (const d in S.pages) { if (hit) break; search(S.pages[d], null, d); }
  return hit;
}

function flat(S, page) { const out = []; walk(S.pages[page] || [], (b) => out.push(b)); return out; }
function hasContent(b) { return b.type === 'head' || b.type === 'raw' || b.text.trim() !== ''; }
function newId(S) { let id; do { id = randomId(); } while (S.ids.has(id)); S.ids.add(id); return id; }
function validDate(s) {
  const [y, m, d] = s.split('-').map(Number), t = new Date(y, m - 1, d);
  return t.getFullYear() === y && t.getMonth() === m - 1 && t.getDate() === d;
}

// ---- 内存索引：按版本号缓存，结构变化后首次使用时重建 ----
const TAG_RE = /(?<![A-Za-z0-9\\])([@#])(?:\{([^}\n]+)\}|([A-Za-z][A-Za-z0-9_-]*(?:\.[A-Za-z0-9_-]+)*))/g;   // 名字中间允许点号：@Firstname.Lastname；句末的点不算
const REF_RE = new RegExp(`\\[\\[PJ\\/[^\\]|\\[]+\\|(${ID_RE})\\]\\]|\\(\\((${ID_RE})\\)\\)`, 'g');
let cache = { S: null, ver: -1 };
function index(S) {
  if (cache.S === S && cache.ver === S.ver) return cache;
  const P = {}, byId = {}, tags = new Map(), refs = new Map(), byProj = new Map();
  const add = (map, k, v) => { let a = map.get(k); if (!a) map.set(k, a = []); a.push(v); };
  const go = (list, ctx, page) => {
    for (const b of list) {
      b.page = page;
      if (b.type === 'raw') { go(b.children, ctx, page); continue; }
      if (b.id) byId[b.id] = b;
      if (b.type === 'proj' || b.type === 'branch') { if (b.id) P[b.id] = { id: b.id, name: b.text, type: b.type, parent: b.owner, life: b.life, date: b.date }; }
      else if (b.type === 'ord') {
        b.own = ctx;   // 推导出的归属，随索引一起刷新
        if (b.id) {
          add(byProj, ctx, b);
          let m;
          TAG_RE.lastIndex = 0;
          while ((m = TAG_RE.exec(b.text))) add(tags, m[1] + (m[2] || m[3]), b.id);
          REF_RE.lastIndex = 0;
          while ((m = REF_RE.exec(b.text))) add(refs, m[1] || m[2], b.id);
          if (b.extParent) add(refs, b.extParent, b.id);
        }
      }
      go(b.children, childCtx(b, ctx), page);
    }
  };
  for (const d in S.pages) go(S.pages[d], 'INBOX', d);
  return (cache = { S, ver: S.ver, P, byId, tags, refs, byProj });
}
function projects(S) { return index(S).P; }
function recordsByTag(S, tag) { const ix = index(S); return (ix.tags.get(tag) || []).map((id) => ix.byId[id]); }
function referenced(S, id) { return !!id && (index(S).refs.get(id) || []).some((x) => x !== id); }

function projectPath(P, id) {
  const parts = []; let cur = P[id], guard = 0;
  while (cur && guard++ < 20) { parts.unshift(cur.name); cur = cur.type === 'branch' ? P[cur.parent] : null; }
  return parts.join(' / ');
}
function normName(s) { return s.normalize('NFC').trim().replace(/\s+/g, ' ').replace(/[A-Z]/g, (c) => c.toLowerCase()); }
function matchProjects(S, name) { const n = normName(name); return Object.values(projects(S)).filter((p) => normName(p.name) === n); }

// 归属由缩进推导：声明块和项目标题块为其下的记录提供项目，普通块沿用上层，顶层为 Inbox
function childCtx(b, ctx) { return b.type === 'head' ? b.proj : (b.type === 'ord' || b.type === 'raw' ? ctx : b.id); }
function ownerAt(S, key) {
  let found = 'INBOX';
  const go = (list, ctx) => { for (const b of list) { if (b.key === key) { found = ctx; return true; } if (go(b.children, childCtx(b, ctx))) return true; } return false; };
  for (const d in S.pages) if (go(S.pages[d], 'INBOX')) break;
  return found;
}

// ---- 正规化 ----
const RE_ST = new RegExp(`^\\[(TODO|WAIT|DONE)(?::(${DATE_RE}))?\\]\\s*`);
const RE_ST_END = new RegExp(`\\s*\\[(TODO|WAIT|DONE)(?::(${DATE_RE}))?\\]$`);
const RE_PURE = new RegExp(`^\\[\\[PJ\\/[^\\]|\\[]+\\|(${ID_RE})\\]\\]$`);

function normalizeRefs(S, text) {
  if (text.indexOf('[[') < 0) return text;
  return text.replace(/\[\[([^\[\]|]+)\]\]/g, (all, inner) => {
    if (/^\d{4}-\d{2}-\d{2}$/.test(inner)) return all;
    const hits = matchProjects(S, inner.replace(/^PJ\//, ''));
    return hits.length === 1 ? `[[PJ/${hits[0].name}|${hits[0].id}]]` : all;
  });
}

// 失焦或结构操作前调用：只移动和补全字段，不改写正文
function commitBlock(S, b, today) {
  if (b.type === 'head' || b.type === 'raw') return;
  const before = b.text + '|' + b.status + '|' + b.type;
  if (b.type !== 'ord') b.text = b.text.replace(/[|\[\]\n]/g, '').normalize('NFC').trim();
  else {
    let t = b.text.replace(/^\n+/, '').replace(/\s+$/, '');
    const head = t.match(RE_ST), tail = head ? null : t.match(RE_ST_END);
    if (head) { b.status = head[1]; b.statusDate = head[2] && validDate(head[2]) ? head[2] : today; t = t.slice(head[0].length); }
    else if (tail) { b.status = tail[1]; b.statusDate = tail[2] && validDate(tail[2]) ? tail[2] : today; t = t.slice(0, t.length - tail[0].length); }
    b.text = normalizeRefs(S, t);
    const pure = b.text.match(RE_PURE);
    if (pure && !b.status && projects(S)[pure[1]]) { b.type = 'head'; b.proj = pure[1]; b.text = ''; }
  }
  if (before !== b.text + '|' + b.status + '|' + b.type) bump(S);
}

// 给当前页补 ID 和状态日期；有了非标题的上层记录后不再保留跨文件父记录
function ensureIds(S, today, date) {
  const fix = (list, logical) => {
    for (const b of list) {
      if (b.type === 'raw') { fix(b.children, logical); continue; }
      if (!b.id && hasContent(b)) { b.id = newId(S); bump(S); }
      if (b.status && !b.statusDate) b.statusDate = today;
      if (logical && b.extParent) b.extParent = null;
      fix(b.children, b.type === 'head' ? logical : (b.id && hasContent(b) ? b : logical));
    }
  };
  fix(S.pages[date] || [], null);
}

function serializePage(S, date) {
  const lines = ['<!-- worklog-schema: ' + SCHEMA + ' -->', '# Journal ' + date, ''], P = projects(S);
  // parentId 是逻辑父记录：项目标题块对父子关系透明
  const emit = (list, depth, parentId, ctx) => {
    for (const b of list) {
      if (b.type === 'raw') { lines.push(b.text); emit(b.children, depth + 1, parentId, ctx); continue; }
      if (!hasContent(b) || !b.id) { emit(b.children, depth, parentId, ctx); continue; }
      const ind = '  '.repeat(depth);
      let payload, cont = b.note ? b.note.split('\n') : [], own = ctx;
      if (b.type === 'proj') { payload = `[[PJ/${b.text}]] Project created.` + (b.life ? ` [ARCHIVED:${b.life}]` : ''); own = null; }
      else if (b.type === 'branch') { payload = `[[PJ/${b.text}]] Branch created.` + (b.life ? ` [COMPLETED:${b.life}]` : ''); own = b.owner; }
      else if (b.type === 'head') { payload = `[[PJ/${P[b.proj] ? P[b.proj].name : (b.label || 'unknown')}|${b.proj}]]`; own = b.proj; }
      else {
        const parts = b.text.split('\n');
        payload = (b.status ? `[${b.status}:${b.statusDate}] ` : '') + parts[0];
        cont = parts.slice(1);
        if (b.conflict) own = b.conflict;   // 归属冲突未解决前保留文件里原有的标记
      }
      let line = `${ind}- ${b.date} ${payload} ((${b.id}))`;
      if (own) line += own === 'INBOX' ? ' ^pj(INBOX)' : ` ^pj((${own}))`;
      const pr = parentId || b.extParent;
      if (pr) line += ` ^pr((${pr}))`;
      if (b.del) line += ` ^del(${b.del})`;
      lines.push(line);
      for (const c of cont) lines.push(ind + '  |' + (c ? ' ' + c : ''));
      emit(b.children, depth + 1, b.type === 'head' ? parentId : b.id, childCtx(b, ctx));
    }
  };
  emit(S.pages[date] || [], 0, null, 'INBOX');
  return lines.join('\n') + '\n';
}

// ---- 解析 ----
const RE_TAIL = new RegExp(`^(.*) \\(\\((${ID_RE})\\)\\)((?:\\s+\\^[a-z]+\\(\\S*\\))*)\\s*$`);
const RE_LEAD_DATE = new RegExp(`^(${DATE_RE})\\s+(.*)$`);
const RE_DECL = new RegExp(`^\\[\\[PJ\\/([^\\[\\]|]+)\\]\\] (Project|Branch) created\\.(?: \\[(ARCHIVED|COMPLETED):(${DATE_RE})\\])?$`);
const RE_HEAD = new RegExp(`^\\[\\[PJ\\/([^\\[\\]|]+)\\|(${ID_RE})\\]\\]$`);
const RE_PJ = new RegExp(`^\\^pj\\(\\((${ID_RE})\\)\\)$`);
const RE_PR = new RegExp(`^\\^pr\\(\\((${ID_RE})\\)\\)$`);
const RE_DEL = new RegExp(`^\\^del\\((${DATE_RE})\\)$`);

function parseHeader(S, str, date, today, out, line) {
  const bad = (msg) => { out.diags.push({ line, level: 'error', msg }); return null; };
  const takeStatus = (o, m) => { o.status = m[1]; if (m[2] && validDate(m[2])) o.statusDate = m[2]; else { o.statusDate = today; out.needsWrite = true; } };
  const m = str.match(RE_TAIL);
  if (m) {   // 已有 ID 的规范行
    let stored = null, pr = null, del = null, x;
    for (const t of m[3].trim().split(/\s+/)) {
      if (!t) continue;
      if ((x = t.match(RE_PJ))) stored = x[1];
      else if (t === '^pj(INBOX)') stored = 'INBOX';
      else if ((x = t.match(RE_PR))) pr = x[1];
      else if ((x = t.match(RE_DEL)) && validDate(x[1])) del = x[1];
      else return bad('Unrecognized metadata ' + t);
    }
    const d = m[1].match(RE_LEAD_DATE);
    if (!d || !validDate(d[1])) return bad('The record has no valid date');
    const base = { id: m[2], date: d[1], extParent: pr, fresh: true };
    let head = d[2];
    S.ids.add(m[2]);
    if ((x = head.match(RE_DECL))) {
      if (x[2] === 'Project') return mk({ ...base, type: 'proj', text: x[1].trim(), life: x[3] === 'ARCHIVED' ? x[4] : null });
      return mk({ ...base, type: 'branch', text: x[1].trim(), owner: stored && stored !== 'INBOX' ? stored : null, life: x[3] === 'COMPLETED' ? x[4] : null });
    }
    if ((x = head.match(RE_HEAD))) return mk({ ...base, type: 'head', proj: x[2], label: x[1] });
    const o = { ...base, stored, del };
    if ((x = head.match(RE_ST))) { takeStatus(o, x); head = head.slice(x[0].length); }
    if (!head.trim()) return bad('The record has no text');
    o.text = head;
    return mk(o);
  }
  // 没有 ID：待正规化的手写行
  out.needsWrite = true;
  const o = { date, pending: true, fresh: true };
  let rest = str, x = rest.match(RE_LEAD_DATE);
  if (x && validDate(x[1])) { o.date = x[1]; rest = x[2]; }
  if ((x = rest.match(RE_DECL))) return mk({ ...o, type: x[2] === 'Project' ? 'proj' : 'branch', text: x[1].trim() });
  if ((x = rest.match(RE_ST))) { takeStatus(o, x); rest = rest.slice(x[0].length); }
  else if ((x = rest.match(RE_ST_END))) { takeStatus(o, x); rest = rest.slice(0, rest.length - x[0].length); }
  if (!rest.trim()) return bad('The record has no text');
  o.text = rest;
  return mk(o);
}

function parseFile(S, text, date, today) {
  const out = { blocks: [], diags: [], needsWrite: false, unsupported: null };
  const lines = text.replace(/\r/g, '').split('\n');
  let i = 0;
  const v = lines[0] && lines[0].match(/^<!-- worklog-schema: ([\d.]+) -->\s*$/);
  if (v) { if (parseFloat(v[1]) > parseFloat(SCHEMA)) { out.unsupported = v[1]; return out; } i = 1; }
  else if (text.trim()) out.needsWrite = true;
  if (lines[i] && lines[i].startsWith('# ')) i++;
  const stack = [];
  let last = null, lastLevel = -1;
  for (; i < lines.length; i++) {
    const raw = lines[i];
    if (!raw.trim()) continue;
    let level = 0, spaces = 0, k = 0;
    for (; k < raw.length; k++) { const c = raw.charCodeAt(k); if (c === 9) level++; else if (c === 32) spaces++; else break; }
    if (level || spaces % 2) out.needsWrite = true;
    level += spaces >> 1;
    const rest = raw.slice(k);
    if (last && level > lastLevel && !rest.startsWith('- ')) {   // 续行
      let piece;
      if (rest === '|') piece = ''; else if (rest.startsWith('| ')) piece = rest.slice(2); else { piece = rest; out.needsWrite = true; }
      if (last.type === 'ord') last.text += '\n' + piece; else last.note = last.note == null ? piece : last.note + '\n' + piece;
      continue;
    }
    while (stack.length && stack[stack.length - 1].level >= level) stack.pop();
    const sibs = stack.length ? stack[stack.length - 1].block.children : out.blocks;
    if (!rest.startsWith('- ')) {
      sibs.push(mk({ type: 'raw', text: raw, date }));
      out.diags.push({ line: i + 1, level: 'warn', msg: 'Unrecognized line, kept as it is' });
      last = null; continue;
    }
    let b = parseHeader(S, rest.slice(2).trim(), date, today, out, i + 1);
    if (!b) { b = mk({ type: 'raw', text: raw, date, err: true }); last = null; } else { last = b; lastLevel = level; }
    sibs.push(b);
    stack.push({ level, block: b });
  }
  return out;
}

// 全部文件解析完后调用：补全手写行、推导关系、生成诊断
function settle(S, today) {
  const diags = [];
  eachBlock(S, (b) => { b.dup = false; if (b.pending && b.type !== 'ord' && !b.id) b.id = newId(S); });
  bump(S);
  eachBlock(S, (b) => { if (b.pending && b.type === 'ord') { b.text = normalizeRefs(S, b.text); const p = b.text.match(RE_PURE); if (p && !b.status) { b.type = 'head'; b.proj = p[1]; b.text = ''; } } });
  const seen = new Map();
  const pass = (list, logical, ctx, date) => {
    for (const b of list) {
      if (b.type === 'raw') { if (b.err) diags.push({ date, key: b.key, level: 'error', msg: 'This record could not be parsed, kept as it is' }); pass(b.children, logical, ctx, date); continue; }
      if (b.type === 'branch' && b.pending) b.owner = ctx === 'INBOX' ? null : ctx;
      if (!b.id && hasContent(b)) b.id = newId(S);
      if (b.id) { const o = seen.get(b.id); if (o) { o.dup = b.dup = true; } else seen.set(b.id, b); }
      if (logical) { if (b.fresh && b.extParent && b.extParent !== logical.id) diags.push({ date, key: b.key, level: 'warn', msg: 'Parent mark disagreed with the indentation; corrected to follow the indentation' }); b.extParent = null; }
      if (b.type === 'ord' && b.fresh && !b.pending && b.stored && b.stored !== ctx) b.conflict = b.stored;
      b.pending = false; b.fresh = false; b.stored = undefined;
      pass(b.children, b.type === 'head' ? logical : (b.id ? b : logical), childCtx(b, ctx), date);
    }
  };
  for (const d in S.pages) pass(S.pages[d], null, 'INBOX', d);
  bump(S);
  const { P, byId } = index(S);
  eachBlock(S, (b, parent, date) => {
    const push = (level, msg) => diags.push({ date, key: b.key, level, msg });
    if (b.dup) push('block', 'Duplicate record ID: ' + b.id);
    if (b.conflict) push('warn', 'Ownership conflict: the mark in the file disagrees with the indentation');
    if (b.type === 'head' && !P[b.proj]) push('error', 'Project heading points to a project that does not exist');
    if (b.type === 'branch' && !P[b.owner]) push('error', 'Branch has no valid parent project');
    if (b.extParent && !byId[b.extParent]) push('warn', 'Parent mark points to a record that does not exist');
  });
  for (const d in S.pdiags) for (const x of S.pdiags[d]) diags.push({ date: d, line: x.line, level: x.level, msg: x.msg });
  S.diags = diags;
  return diags;
}

function loadPage(S, date, text, today) {
  const r = parseFile(S, text, date, today);
  if (r.unsupported) { S.pages[date] = []; S.pdiags[date] = [{ level: 'block', msg: 'File uses schema version ' + r.unsupported + ', newer than this app supports; not loaded' }]; return { needsWrite: false, unsupported: true }; }
  S.pages[date] = r.blocks; S.pdiags[date] = r.diags;
  bump(S);
  return r;
}

// ---- 块操作 ----
function indent(S, key) {
  const loc = find(S, key);
  if (!loc || loc.index === 0) return false;
  const prev = loc.list[loc.index - 1];
  if (prev.type === 'raw') return false;
  loc.list.splice(loc.index, 1);
  prev.children.push(loc.b);
  bump(S); return true;
}

function outdent(S, key) {
  const loc = find(S, key);
  if (!loc || !loc.parent) return false;
  const ploc = find(S, loc.parent.key);
  loc.list.splice(loc.index, 1);
  ploc.list.splice(ploc.index + 1, 0, loc.b);
  loc.b.extParent = null;
  bump(S); return true;
}

function move(S, key, dir) {
  const loc = find(S, key), j = loc ? loc.index + dir : -1;
  if (!loc || j < 0 || j >= loc.list.length) return false;
  loc.list.splice(loc.index, 1);
  loc.list.splice(j, 0, loc.b);
  bump(S); return true;
}

function newAfter(S, key) {
  const loc = find(S, key), nb = mk({ date: loc.page });
  if (loc.b.children.length || (loc.b.type !== 'ord' && loc.b.type !== 'raw')) loc.b.children.unshift(nb);
  else loc.list.splice(loc.index + 1, 0, nb);
  return nb;
}

function newBefore(S, key) {
  const loc = find(S, key), nb = mk({ date: loc.page });
  loc.list.splice(loc.index, 0, nb); return nb;
}

function split(S, key, pos) {
  const loc = find(S, key), b = loc.b;
  const nb = mk({ date: b.date, text: b.text.slice(pos).replace(/^\s+/, '') });
  b.text = b.text.slice(0, pos).replace(/\s+$/, '');
  loc.list.splice(loc.index + 1, 0, nb);
  bump(S); return nb;
}

function removeBlock(S, key) { const loc = find(S, key); loc.list.splice(loc.index, 1); bump(S); }

function mergeUp(S, key) {
  const loc = find(S, key), b = loc.b, order = flat(S, loc.page);
  const prev = order[order.indexOf(b) - 1];
  if (!prev) return { ok: false, msg: '' };
  if (prev.type === 'ord' && !hasContent(prev) && !prev.id && !prev.children.length) { removeBlock(S, prev.key); return { ok: true, focus: b.key, pos: 0 }; }
  if (b.type !== 'ord' || prev.type !== 'ord') return { ok: false, msg: 'Project lines and headings cannot be merged' };
  if (b.children.length) return { ok: false, msg: 'This block has children and cannot be merged into the one above' };
  if (b.status) return { ok: false, msg: 'This block has a status and cannot be merged into the one above' };
  if (b.del || prev.del) return { ok: false, msg: 'Deleted blocks cannot be merged' };
  if (referenced(S, b.id)) return { ok: false, msg: 'Other records refer to this block, so it cannot be merged into the one above' };
  const pos = prev.text.length;
  prev.text += b.text;
  removeBlock(S, key);
  return { ok: true, focus: prev.key, pos };
}

function deleteBlock(S, key, today) {

async function releaseWorkspaceLock() {

}

  if (!navigator.locks) return true;
  const name = 'worklog:' + FS.dir.name;

  await releaseWorkspaceLock();
  return new Promise((resolve, reject) => {
    const done = navigator.locks.request(name, { ifAvailable: true }, (lock) => {

        resolve(true);
      });
    });
    done.catch(reject);
  });
}

  if (openingWorkspace) return;
  const app = $('#app');
  let loading = false;
  openingWorkspace = app.inert = true;
  try {
    if (dirty.size) {
      await flush();
      if (dirty.size) return;
    }
    if (await select() === false) return;
    loading = true;
    await start();
    loading = false;
    if (afterOpen) afterOpen();
  } catch (e) {
    if (loading) {
      app.hidden = true;
      $('#gate').hidden = false;
      await releaseWorkspaceLock();

    if (e.name === 'AbortError') return;
    if (app.hidden) $('#gate-msg').textContent = 'Could not open the folder: ' + e.message;

const KEYS = [
  ['Move', [['J  ↓', 'Next item'], ['K  ↑', 'Previous item'], ['Shift+J  Ctrl+J', 'Next project heading'], ['Shift+K  Ctrl+K', 'Previous project heading']]],
  ['Act', [['Enter', 'Edit record · fold or unfold heading'], ['Esc', 'Leave editing · clear focus'], ['O', 'Open record in journal · open project page'], ['G', 'Group by project (Working, tags)'], ['S', 'Reverse time order'], ['F', 'Collapse or expand sidebar'], ['/', 'Search'], ['?', 'This help']]],
  ['Go to', NAV.map(([, label], i) => [`${i + 1}  Ctrl+Shift+${label[0]}`, label])],
  ['While editing', [['Ctrl/Cmd+Enter', 'Cycle none → TODO → WAIT → DONE'], ['Shift+Enter', 'Continuation line'], ['Tab  Shift+Tab', 'Indent · outdent (journal)'], ['Alt+Shift+↑↓', 'Move block (journal)'], ['[[', 'Project menu (journal)']]]
];
function toggleHelp() {
  const d = $('#help');
  if (d.open) return d.close();
  d.textContent = '';
  const x = el('button', 'mini', 'Esc'); x.onclick = () => d.close();
  const top = el('div', 'help-top'); top.append(el('strong', null, 'Keyboard shortcuts'), x); d.appendChild(top);
  const grid = el('div', 'help-grid');
  for (const [title, rows] of KEYS) {
    const sec = el('section'); sec.appendChild(el('h2', null, title));
    for (const [k, what] of rows) { const r = el('div', 'help-row'); r.append(el('kbd', null, k), el('span', null, what)); sec.appendChild(r); }
    grid.appendChild(sec);
  }
  d.appendChild(grid);
  d.showModal();
}
function navKey(e) {
  if (openingWorkspace || $('#app').hidden || e.metaKey || e.altKey || e.isComposing) return;
  const L = e.code && e.code.startsWith('Key') ? e.code[3] : (e.key || '').length === 1 ? e.key.toUpperCase() : '';
  // 侧栏跳转：Ctrl+Shift+首字母，在任何地方都有效（包括编辑中）
  if (e.ctrlKey && e.shiftKey) {
    const hit = L && NAV.find(([, label]) => label[0] === L);
    if (!hit) return;
    e.preventDefault(); e.stopPropagation();
    if ($('#help').open) $('#help').close();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    return void show(hit[0]);
  }
  const a = document.activeElement, tag = a && a.tagName, from = e.target && e.target.tagName;
  if ([tag, from].some((x) => x === 'TEXTAREA' || x === 'INPUT' || x === 'SELECT')) return;   // 编辑框里按的键不归这里管
  if ($('#help').open) { if (e.key === '?') { e.preventDefault(); toggleHelp(); } return; }
  if (e.key === '?') { e.preventDefault(); return toggleHelp(); }
  if (e.key === '/' && !e.ctrlKey) {   // 搜索框；侧栏折叠着就先展开
    e.preventDefault();
    if (cfg.nav === 'narrow') { cfg.nav = 'wide'; saveCfg(); drawNav(); }
    $('#q').focus(); $('#q').select(); return;
  }
  const down = L === 'J' || e.key === 'ArrowDown', up = L === 'K' || e.key === 'ArrowUp';
  const items = navItems(), i = items.findIndex((x) => x.classList.contains('cur')), cur = items[i];
  const move = (n) => {
    e.preventDefault();
    if (a && a.blur && a !== document.body) a.blur();   // 否则回车会触发刚才点过的按钮
    if (n < 0 || n >= items.length) return;
    navIdx = n; if (view === 'journal') navCur = items[n].parentNode.dataset.key;
    setCur(items[n]);
  };
  if (/^[1-7]$/.test(e.key) && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); return void show(NAV[e.key - 1][0]); }   // 数字键：侧栏第几项
  if (e.ctrlKey || e.shiftKey && (L === 'J' || L === 'K')) {   // Ctrl+J/K 或 Shift+J/K：跳到下一个、上一个项目标题
    if (!down && !up || e.key.startsWith('Arrow')) return;
    const isHead = (x) => (view === 'journal' ? x.classList.contains('decl') : !x.classList.contains('rec'));
    let n = i;
    do { n += down ? 1 : -1; } while (n >= 0 && n < items.length && !isHead(items[n]));
    return move(n);
  }
  if (down || up) { if (items.length) move(i < 0 ? 0 : Math.max(0, Math.min(items.length - 1, i + (down ? 1 : -1)))); return; }
  if (L === 'F' && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); return void $('#nav-toggle').click(); }
  if (L === 'S' && view !== 'journal') { const g = $('#view .icon-btn.sort'); if (g) { e.preventDefault(); g.click(); } return; }
  if (L === 'G' && view !== 'journal') { const g = $('#view .icon-btn.grp'); if (g) { e.preventDefault(); g.click(); } return; }
  if (e.key === 'Escape') { if (cur) { navIdx = null; navCur = null; setCur(null); } return; }
  if (!cur || tag === 'BUTTON' && e.key === 'Enter') return;
  if (e.key === 'Enter') {
    e.preventDefault();
    if (view === 'journal') focusBlock(cur.parentNode.dataset.key);
    else if (cur.classList.contains('rec')) { if (cur.classList.contains('editable')) cur.click(); }
    else if (cur.classList.contains('foldable') || cur.classList.contains('grp-head')) cur.click();
  } else if (L === 'O' && view !== 'journal') {
    e.preventDefault();
    const b = cur.querySelector('.goto') || cur.querySelector('.pj-name');
    if (b) b.click();
  }
}
window.addEventListener('keydown', navKey, true);
</script>
</body>
</html>
